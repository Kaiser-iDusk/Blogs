<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>This is test 2 blog</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    article p {
      margin-top: 1rem;
      line-height: 1.8;
    }

    article h1, article h2, article h3 {
      margin-top: 2rem;
      font-weight: 700;
    }

    article blockquote {
      border-left: 4px solid #e5e7eb;
      padding-left: 1rem;
      color: #4b5563;
      font-style: italic;
    }

    article code {
      background: #f3f4f6;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
    }
  </style>
</head>

<body class="bg-gray-50 text-gray-900">

  <header class="border-b bg-white sticky top-0">
    <div class="max-w-3xl mx-auto px-6 py-4 flex justify-between items-center">
      <a href="/" class="text-gray-700 hover:underline">← Back to Blogs</a>
      <span class="text-sm text-gray-500">
        Written by <strong>adminboss</strong>
      </span>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-6 py-10">
    <h1 class="text-4xl font-bold mb-6">
      This is test 2 blog
    </h1>

    <article class="prose prose-lg max-w-none">
      <p>Hi everyone this is a test blog</p>

    </article>
  </main>

</body>
</html>
